; Phase 1.5: LittleFS config + Web UI (CONFIG) + dynamic Modbus (WORK)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOPSTACK_SIZE=16384
